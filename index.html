<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Manuales SEM</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#0f172a" />
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
  :root {
    --bg: #0f172a;
    --panel: #1e293b;
    --panel-2: #273449;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #38bdf8;
    --accent-2: #22c55e;
    --warn: #f59e0b;
    --danger: #ef4444;
    --border: #334155;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  #root { min-height: 100vh; }
  .app { max-width: 1100px; margin: 0 auto; padding: 16px; }
  header.topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; flex-wrap: wrap; gap: 8px; }
  header.topbar h1 { font-size: 1.3rem; margin: 0; }
  header.topbar .sub { color: var(--muted); font-size: 0.85rem; }

  .search-box { position: relative; margin-bottom: 20px; }
  .search-box input {
    width: 100%; padding: 14px 46px 14px 16px; font-size: 1rem;
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px; color: var(--text);
  }
  .search-box input:focus { outline: 2px solid var(--accent); }
  .search-box .icon { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); }

  .add-row { display:flex; align-items:center; gap:10px; margin: -10px 0 20px; color: var(--muted); font-size: 0.9rem; }
  .add-btn {
    display:flex; align-items:center; gap:6px; background: var(--accent-2); color: #06280f; border: none;
    padding: 8px 14px; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 0.9rem;
  }
  .add-btn:hover { filter: brightness(1.08); }
  .add-btn:disabled { opacity: 0.6; cursor: default; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
  .card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 14px;
    cursor: pointer; transition: border-color .15s, transform .1s;
  }
  .card:hover { border-color: var(--accent); transform: translateY(-1px); }
  .card h3 { margin: 0 0 4px; font-size: 1rem; }
  .card .meta { color: var(--muted); font-size: 0.8rem; }
  .badge-row { display:flex; gap:6px; margin-top: 10px; flex-wrap: wrap; }
  .badge { font-size: 0.7rem; padding: 2px 8px; border-radius: 999px; background: var(--panel-2); color: var(--muted); }
  .badge.ok { color: var(--accent-2); }
  .badge.warn { color: var(--warn); }

  .empty-state { text-align: center; color: var(--muted); padding: 60px 20px; }

  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: flex;
    align-items: center; justify-content: center; z-index: 50; padding: 16px;
  }
  .modal { background: var(--panel); border-radius: 14px; padding: 20px; max-width: 640px; width: 100%; max-height: 88vh; overflow-y: auto; border: 1px solid var(--border); }
  .modal h2 { margin-top: 0; }
  .modal .close { float: right; background: none; border: none; color: var(--muted); font-size: 1.3rem; cursor: pointer; }

  .progress-list { list-style: none; padding: 0; margin: 16px 0; }
  .progress-list li { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
  .progress-list li:last-child { border-bottom: none; }
  .spinner { width: 14px; height: 14px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; flex-shrink: 0; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .check { color: var(--accent-2); }
  .fail { color: var(--danger); }

  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin: 16px 0; overflow-x: auto; }
  .tab { padding: 10px 14px; cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; font-size: 0.9rem; }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }

  .section-title { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .section-title h4 { margin: 0; font-size: 0.95rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
  .link-item { display:flex; align-items:center; justify-content:space-between; gap: 10px; padding: 10px; background: var(--panel-2); border-radius: 8px; margin-bottom: 8px; font-size: 0.9rem; }
  .link-item a { color: var(--accent); text-decoration: none; }
  .link-item a:hover { text-decoration: underline; }
  .tag { font-size: 0.7rem; color: var(--muted); background: var(--bg); padding: 2px 7px; border-radius: 6px; }

  .item-row { display:flex; align-items:center; justify-content:space-between; padding: 9px 10px; background: var(--panel-2); border-radius: 8px; margin-bottom: 6px; font-size: 0.9rem; }
  .item-row .origen { font-size: 0.7rem; color: var(--muted); }
  .shared-alert { background: #422006; border: 1px solid var(--warn); color: #fde68a; padding: 8px 10px; border-radius: 8px; font-size: 0.82rem; margin-top: 6px; }

  .inline-add { display:flex; gap:8px; margin-top: 10px; }
  .inline-add input { flex:1; padding: 8px 10px; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-size: 0.85rem; }
  .inline-add button { padding: 8px 12px; background: var(--panel-2); border: 1px solid var(--border); border-radius: 6px; color: var(--text); cursor: pointer; font-size: 0.85rem; }

  .chat-box { display: flex; flex-direction: column; height: 460px; background: var(--panel-2); border-radius: 10px; overflow: hidden; }
  .chat-messages { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 82%; padding: 9px 12px; border-radius: 10px; font-size: 0.9rem; line-height: 1.4; }
  .msg.user { align-self: flex-end; background: var(--accent); color: #04202e; }
  .msg.bot { align-self: flex-start; background: var(--bg); border: 1px solid var(--border); }
  .msg .sources { margin-top: 6px; font-size: 0.75rem; color: var(--muted); }
  .msg .sources a { color: var(--accent); }
  .chat-input { display: flex; gap: 8px; padding: 10px; border-top: 1px solid var(--border); }
  .chat-input input { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text); }
  .chat-input button { padding: 10px 16px; border-radius: 8px; border: none; background: var(--accent); color: #04202e; font-weight: 600; cursor: pointer; }

  .back-btn { background: none; border: none; color: var(--accent); cursor: pointer; font-size: 0.9rem; padding: 0; margin-bottom: 10px; }
  .equipo-title { display:flex; align-items:baseline; gap: 10px; flex-wrap: wrap; }
  .equipo-title h2 { margin: 0; }
  .equipo-title .marca-modelo { color: var(--muted); font-size: 0.95rem; }
  .images-strip { display:flex; gap:8px; overflow-x:auto; margin: 10px 0; }
  .images-strip img { height: 90px; border-radius: 8px; border: 1px solid var(--border); }

  footer.note { color: var(--muted); font-size: 0.75rem; text-align:center; margin-top: 30px; padding-bottom: 20px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react" src="app.js"></script>
</body>
</html>
