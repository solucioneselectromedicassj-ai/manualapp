<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Manuales SEM</title>
<meta name="description" content="Biblioteca de manuales de equipos biomédicos con consultas por IA, insumos y repuestos." />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<meta name="theme-color" content="#0284c7" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Manuales SEM" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  :root {
    --bg: #f4f7fb;
    --panel: #ffffff;
    --panel-2: #f1f5f9;
    --text: #0f172a;
    --muted: #64748b;
    --accent: #0284c7;
    --accent-soft: #e0f2fe;
    --accent-2: #16a34a;
    --warn: #b45309;
    --danger: #dc2626;
    --border: #dbe3ee;
    --shadow: 0 1px 2px rgba(15, 23, 42, .06), 0 2px 8px rgba(15, 23, 42, .04);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-text-size-adjust: 100%; }
  #root { min-height: 100vh; }
  a { color: var(--accent); }
  button { font: inherit; }
  .app { max-width: 1100px; margin: 0 auto; padding: 16px; }
  .muted { color: var(--muted); }
  .small { font-size: 0.8rem; }
  .mt { margin-top: 12px; } .mb { margin-bottom: 12px; }
  .row { display: flex; align-items: center; } .gap { gap: 8px; } .wrap { flex-wrap: wrap; } .grow { flex: 1; min-width: 0; }
  .row-end { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }

  header.topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; flex-wrap: wrap; gap: 12px; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand img { border-radius: 10px; }
  header.topbar h1 { font-size: 1.3rem; margin: 0; }
  header.topbar .sub { color: var(--muted); font-size: 0.85rem; }

  .btn {
    display: inline-flex; align-items: center; gap: 6px; background: var(--panel); color: var(--text); border: 1px solid var(--border);
    padding: 8px 14px; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 0.88rem; text-decoration: none; box-shadow: var(--shadow);
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { filter: brightness(1.07); color: #fff; }
  .btn.small { padding: 5px 10px; font-size: 0.8rem; }
  .btn.danger-outline { color: var(--danger); }
  .btn.danger-outline:hover { border-color: var(--danger); }
  .btn:disabled { opacity: .55; cursor: default; }
  .icon-btn { background: none; border: none; color: var(--muted); font-size: 1.1rem; cursor: pointer; padding: 2px 6px; border-radius: 6px; }
  .icon-btn:hover { background: var(--panel-2); color: var(--danger); }
  .linklike { background: none; border: none; color: var(--accent); cursor: pointer; font-weight: 600; padding: 0; text-decoration: underline; }

  .banner { background: #fffbeb; border: 1px solid #fcd34d; color: #78350f; padding: 10px 12px; border-radius: 10px; font-size: 0.85rem; margin-bottom: 14px; }
  .alert { background: #fef2f2; border: 1px solid #fca5a5; color: #7f1d1d; padding: 8px 10px; border-radius: 8px; font-size: 0.85rem; margin-top: 10px; }
  .hint { background: var(--accent-soft); border-radius: 8px; padding: 10px 12px; font-size: 0.85rem; margin: 10px 0; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

  .search-box { position: relative; margin-bottom: 20px; }
  .search-box input {
    width: 100%; padding: 14px 46px 14px 16px; font-size: 1rem;
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px; color: var(--text); box-shadow: var(--shadow);
  }
  .search-box input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .search-box .icon { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); display: flex; }

  .add-row { display: flex; align-items: center; gap: 10px; margin: -8px 0 20px; color: var(--muted); font-size: 0.9rem; flex-wrap: wrap; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
  .card {
    text-align: left; font: inherit; color: inherit; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 14px;
    cursor: pointer; transition: border-color .15s, transform .1s; box-shadow: var(--shadow);
  }
  .card:hover { border-color: var(--accent); transform: translateY(-1px); }
  .card h3 { margin: 0 0 4px; font-size: 1rem; }
  .card .meta { color: var(--muted); font-size: 0.8rem; }
  .badge-row { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  .badge { font-size: 0.7rem; padding: 2px 8px; border-radius: 999px; background: var(--panel-2); color: var(--muted); }
  .badge.ok { color: var(--accent-2); background: #dcfce7; }
  .badge.warn { color: var(--warn); background: #fef3c7; }

  .empty-state { text-align: center; color: var(--muted); padding: 50px 20px; max-width: 520px; margin: 0 auto; line-height: 1.5; }

  .modal-overlay {
    position: fixed; inset: 0; background: rgba(15, 23, 42, .45); display: flex;
    align-items: center; justify-content: center; z-index: 50; padding: 16px;
  }
  .modal { background: var(--panel); border-radius: 14px; padding: 20px; max-width: 640px; width: 100%; max-height: 90vh; overflow-y: auto; border: 1px solid var(--border); box-shadow: 0 20px 50px rgba(15,23,42,.2); }
  .modal.narrow { max-width: 380px; }
  .modal h2 { margin-top: 0; font-size: 1.2rem; }
  .modal .close { float: right; background: none; border: none; color: var(--muted); font-size: 1.4rem; cursor: pointer; }
  .modal label { display: block; font-size: 0.82rem; color: var(--muted); margin-top: 10px; }
  .field, select, .inline-add input {
    width: 100%; padding: 9px 10px; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 0.9rem; margin-top: 4px;
  }
  select { width: auto; }
  .panel-sub { border: 1px solid var(--border); border-radius: 10px; padding: 14px; margin-top: 14px; background: var(--panel); }
  .estado-row { display: flex; gap: 10px; padding: 6px 0; font-size: 0.9rem; }
  .estado { margin-top: 8px; display: flex; align-items: center; gap: 6px; }

  .progress-list { list-style: none; padding: 0; margin: 16px 0; }
  .progress-list li { display: flex; align-items: flex-start; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
  .progress-list li:last-child { border-bottom: none; }
  .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; flex-shrink: 0; margin-top: 2px; vertical-align: middle; }
  .dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--border); flex-shrink: 0; margin-top: 2px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .check { color: var(--accent-2); font-weight: 700; width: 14px; }
  .fail { color: var(--warn); font-weight: 700; width: 14px; }

  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin: 16px 0; overflow-x: auto; }
  .tab { background: none; border: none; border-bottom: 2px solid transparent; padding: 10px 14px; cursor: pointer; color: var(--muted); white-space: nowrap; font-size: 0.9rem; font-weight: 600; }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }

  .section-title { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; gap: 8px; }
  .section-title h4 { margin: 0; font-size: 0.8rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
  .link-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; margin-bottom: 8px; font-size: 0.9rem; }
  .link-item a { text-decoration: none; font-weight: 600; word-break: break-word; }
  .link-item a:hover { text-decoration: underline; }
  .tag { font-size: 0.7rem; color: var(--muted); background: var(--panel-2); padding: 2px 7px; border-radius: 6px; white-space: nowrap; }

  .item-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 10px; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 6px; font-size: 0.9rem; }
  .item-row .origen { font-size: 0.7rem; color: var(--muted); white-space: nowrap; }
  .shared-alert { background: #fffbeb; border: 1px solid #fcd34d; color: #78350f; padding: 8px 10px; border-radius: 8px; font-size: 0.82rem; margin: -2px 0 8px; }

  .inline-add { display: flex; gap: 8px; margin-top: 10px; align-items: center; }
  .inline-add input { flex: 1; margin-top: 0; }

  .video-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
  .video-card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .video-card iframe, .video-card .thumb { width: 100%; aspect-ratio: 16 / 9; border: 0; display: block; }
  .video-card .thumb { background: #000 center / cover no-repeat; cursor: pointer; position: relative; }
  .video-card .play { position: absolute; inset: 0; margin: auto; width: 54px; height: 38px; border-radius: 10px; background: rgba(220, 38, 38, .92); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; }
  .video-meta { padding: 8px 10px; font-size: 0.85rem; }
  .video-meta a { text-decoration: none; font-weight: 600; color: var(--text); }

  .chat-box { display: flex; flex-direction: column; height: min(560px, 70vh); background: var(--panel); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  .chat-messages { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; background: var(--panel-2); }
  .msg { max-width: 85%; padding: 9px 12px; border-radius: 12px; font-size: 0.9rem; line-height: 1.45; white-space: pre-wrap; }
  .msg.user { align-self: flex-end; background: var(--accent); color: #fff; }
  .msg.bot { align-self: flex-start; background: var(--panel); border: 1px solid var(--border); }
  .msg .sources { margin-top: 6px; font-size: 0.75rem; color: var(--muted); }
  .chat-input { display: flex; gap: 8px; padding: 10px; border-top: 1px solid var(--border); }
  .chat-input input { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--panel); color: var(--text); font-size: 0.95rem; min-width: 0; }

  .back-btn { background: none; border: none; color: var(--accent); cursor: pointer; font-size: 0.9rem; padding: 0; margin-bottom: 10px; font-weight: 600; }
  .equipo-title { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .equipo-title h2 { margin: 0; }
  .equipo-title .marca-modelo { color: var(--muted); font-size: 0.9rem; }

  footer.note { color: var(--muted); font-size: 0.75rem; text-align: center; margin-top: 30px; padding-bottom: 20px; }

  @media (max-width: 560px) {
    .app { padding: 12px; }
    .msg { max-width: 92%; }
    header.topbar .btn { padding: 7px 10px; }
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react" src="app.js"></script>
</body>
</html>
